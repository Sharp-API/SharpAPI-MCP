# Publish @sharp-api/mcp-server to npm.
#
# Use OIDC trusted publishing without NPM_TOKEN. Automation tokens can
# conflict with package settings that disallow bypassing 2FA. The npm CLI
# negotiates OIDC; --provenance adds the SLSA attestation.
#
# Trusted publishing requires Node >= 22.14 and npm CLI >= 11.5.1.
# The publish job uses Node 22 and upgrades npm to the 11.x line.
#
# ⚠ npm matches the trusted publisher on the workflow FILENAME. This file must
# stay named publish.yml, and the connection on npmjs.com must say publish.yml
# exactly — all fields are case-sensitive. A mismatch surfaces as ENEEDAUTH,
# which reads like a missing token and is not one.
name: Publish to npm

on:
  release:
    types: [published]
  # Dry run: exercises the gate (including its build) without publishing.
  # The protected publish job only runs on versioned releases.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    # The suite spawns the built server and waits for it to exit. A regression
    # that lets it start instead would hang, so bound the job well under
    # GitHub's 360-minute default; the tests themselves finish in seconds.
    timeout-minutes: 10
    strategy:
      matrix:
        # The MCP SDK v2 requires Node.js 20 or later.
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      # Validate the built server before publishing an immutable npm version.
      # npm versions cannot be pulled back, so the whole suite gates publishing:
      # both stdio handshakes, the control-character refusal, the redactor and
      # the HTTP relay's controls.
      - run: npm test
        env:
          SHARPAPI_KEY: test-key-not-used-for-network

  publish:
    if: github.event_name == 'release' && startsWith(github.ref, 'refs/tags/v')
    needs: gate
    # The job-level `if:` above (not a step-level one) is load-bearing. With the
    # condition only on the publish step, a workflow_dispatch dry run still
    # granted id-token:write and still executed dependency install/build code,
    # which could request OIDC credentials without ever reaching the guarded
    # step. The tag check and the `release` environment gate sit on top of it.
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      # Exact version, not the mutable 11.x tag: this step runs with id-token:write.
      - run: npm install -g npm@11.5.1
      - name: Publish to npm
        run: npm publish --provenance --access public

  # List the release in the MCP Registry (registry.modelcontextprotocol.io).
  # A job of its own, after npm: the registry checks that the npm package it
  # is told about exists and carries the same mcpName, and a separate job can
  # be re-run alone if the registry is unreachable. Re-running `publish`
  # would fail, since an npm version cannot be published twice.
  registry:
    if: github.event_name == 'release' && startsWith(github.ref, 'refs/tags/v')
    needs: publish
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # The registry grants the io.github.Sharp-API/* names to this
      # repository's GitHub OIDC token. No stored secret is involved.
      id-token: write
    env:
      # A fixed release, verified below. Change it on purpose, never to "latest".
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
      - name: Sign in to the MCP Registry
        run: ./mcp-publisher login github-oidc
      - name: Publish server.json
        run: ./mcp-publisher publish
