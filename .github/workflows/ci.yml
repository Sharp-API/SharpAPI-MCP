name: CI

on:
  push:
    branches: [main, "mergify/merge-queue/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Pin actions to immutable commits to prevent upstream tag changes from
      # changing the code executed by CI.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Server starts and speaks MCP
        # Validate a real stdio handshake and tool registration to catch
        # startup failures and invalid tool definitions in CI.
        run: node tests/handshake.mjs
        env:
          SHARPAPI_KEY: test-key-not-used-for-network
